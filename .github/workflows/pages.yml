name: Deploy site
on:
  push:
    branches: [main]
    paths: [site/**, dist/**, ops/config.json]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=$(tr -d '\n' < ops/indexnow_key.txt)
          python3 - "$KEY" > payload.json <<'PY'
          import json, re, sys
          key = sys.argv[1]
          urls = re.findall(r"<loc>(.*?)</loc>", open("_site/sitemap.xml").read())
          print(json.dumps({"host": "m4had.github.io", "key": key,
                            "keyLocation": f"https://m4had.github.io/ozark/{key}.txt", "urlList": urls}))
          PY
          sleep 30
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @payload.json
